name: Notify Jobmint

# Fires whenever cvstack pushes to main.
# Sends a repository_dispatch event to jobmint which triggers
# its sync-subrepo.yml workflow to pull the latest submodule,
# build, and auto-commit the updated pointer.

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to jobmint
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PARENT_REPO_TOKEN }}
          repository: ayehya2/jobmint
          event-type: cvstack-updated
