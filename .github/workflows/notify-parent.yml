name: Notify Jobmint

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to jobmint
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SUB_TOKEN }}
          repository: ayehya2/jobmint
          event-type: cvstack-updated